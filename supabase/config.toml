# Supabase local (supabase start). En producción estos valores se configuran
# en el dashboard: Authentication → Providers → Google.
project_id = "michimi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://www.michimi.com/auth/callback",
  "michimi://auth/callback",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Registro / ingreso con Google
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = true
